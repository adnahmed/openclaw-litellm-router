general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  request_timeout: 120
  num_retries: 2

router_settings:
  # Good default for many providers.
  # Other useful options: usage-based-routing, latency-based-routing
  routing_strategy: simple-shuffle

  enable_pre_call_checks: true
  allowed_fails: 1
  cooldown_time: 180
  num_retries: 2
  timeout: 120

  redis_host: host.docker.internal
  redis_port: 6379
  redis_password: os.environ/REDIS_PASSWORD

model_list:
  - model_name: openclaw-main
    litellm_params:
      model: openai/gemma-4-31b-it
      api_base: https://generativelanguage.googleapis.com/v1beta/openai/
      api_key: os.environ/GEMINI_API_KEY
      drop_params: true
      rpm: 60
      tpm: 100000
      weight: 1
    model_info:
      id: gemma-31-b

  - model_name: openclaw-main
    litellm_params:
      model: openai/gpt-5-mini
      api_base: https://api.individual.githubcopilot.com
      api_key: os.environ/GITHUB_COPILOT_API_KEY
      rpm: 20
      tpm: 50000
      weight: 1
    model_info:
      id: github-copilot-gpt-5-mini
