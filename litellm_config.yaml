general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  request_timeout: 240
  num_retries: 3

router_settings:
  # Better for concurrent workflow/subagent runs than simple-shuffle.
  routing_strategy: least-busy

  # Keep this on: it lets LiteLLM do context/routing checks before provider calls.
  enable_pre_call_checks: true

  # Your old allowed_fails: 1 + cooldown_time: 180 caused the whole model group
  # to become unavailable after brief transient failures.
  allowed_fails: 4
  cooldown_time: 30

  num_retries: 3
  timeout: 240

  # Retry transient problems, but do not waste retries on bad credentials.
  retry_policy:
    TimeoutErrorRetries: 3
    RateLimitErrorRetries: 2
    InternalServerErrorRetries: 2
    AuthenticationErrorRetries: 0

  # Avoid putting deployments into cooldown too aggressively for transient errors.
  # Still cool down auth failures quickly because those usually need key/config fixes.
  allowed_fails_policy:
    TimeoutErrorAllowedFails: 6
    RateLimitErrorAllowedFails: 20
    InternalServerErrorAllowedFails: 6
    AuthenticationErrorAllowedFails: 1
    BadRequestErrorAllowedFails: 1

  redis_host: host.docker.internal
  redis_port: 6379
  redis_password: os.environ/REDIS_PASSWORD

model_list:
  - model_name: openclaw-main
    litellm_params:
      model: openai/gemma-4-31b-it
      api_base: https://generativelanguage.googleapis.com/v1beta/openai/
      api_key: os.environ/GEMINI_API_KEY
      drop_params: true
      rpm: 60
      tpm: 100000
      weight: 1
    model_info:
      id: gemma-31-b

  - model_name: openclaw-main
    litellm_params:
      model: openai/gpt-5-mini
      api_base: https://api.individual.githubcopilot.com
      api_key: os.environ/GITHUB_COPILOT_API_KEY
      drop_params: true
      rpm: 20
      tpm: 50000
      weight: 1
    model_info:
      id: github-copilot-gpt-5-mini
