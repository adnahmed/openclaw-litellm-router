general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  request_timeout: 120
  num_retries: 2

router_settings:
  # Good default for many providers.
  # Other useful options: usage-based-routing, latency-based-routing
  routing_strategy: simple-shuffle

  enable_pre_call_checks: true
  allowed_fails: 1
  cooldown_time: 180
  num_retries: 2
  timeout: 120

  redis_host: redis
  redis_port: 6379
  redis_password: ""

model_list:
  - model_name: openclaw-main
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      rpm: 50
      tpm: 100000
      weight: 1
    model_info:
      id: openai-gpt-4o-mini

  - model_name: openclaw-main
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY
      rpm: 60
      tpm: 100000
      weight: 1
    model_info:
      id: gemini-2-0-flash

  - model_name: openclaw-main
    litellm_params:
      model: anthropic/claude-3-5-haiku-latest
      api_key: os.environ/ANTHROPIC_API_KEY
      rpm: 40
      tpm: 100000
      weight: 1
    model_info:
      id: anthropic-claude-3-5-haiku

  - model_name: openclaw-main
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY
      rpm: 30
      tpm: 60000
      weight: 1
    model_info:
      id: groq-llama-3-1-8b-instant

  - model_name: openclaw-main
    litellm_params:
      model: openrouter/google/gemini-2.0-flash-001
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 30
      tpm: 60000
      weight: 1
    model_info:
      id: openrouter-gemini-2-0-flash

  - model_name: openclaw-main
    litellm_params:
      model: openai/gpt-5-mini
      api_base: https://api.individual.githubcopilot.com
      api_key: os.environ/GITHUB_COPILOT_API_KEY
      rpm: 20
      tpm: 50000
      weight: 1
    model_info:
      id: github-copilot-gpt-5-mini
